[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quality-and-evals"
version = "0.1.0"
description = "How to measure AI and human output: quality gates, SPC, reviewer calibration and RAG retrieval evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ragevallab = "ragevallab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
